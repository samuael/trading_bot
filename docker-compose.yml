services:
  bot:
    build: .
    image: trading-bot:latest
    restart: unless-stopped
    # GATEIO_API_KEY and GATEIO_API_SECRET.
    env_file: .env
    volumes:
      - bot-data:/data
      # Edit strategy.json (e.g. dry_run) and restart, no rebuild needed.
      - ./strategy.json:/app/strategy.json:ro
    ports:
      - "127.0.0.1:2113:2113"
    # On SIGTERM the bot finishes any order sequence in flight (up to 30s) and saves its positions; open positions
    # are resumed on the next start, not closed.
    stop_grace_period: 45s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  prometheus:
    image: prom/prometheus:v2.53.0
    restart: unless-stopped
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - bot

volumes:
  bot-data:
  prometheus-data:
